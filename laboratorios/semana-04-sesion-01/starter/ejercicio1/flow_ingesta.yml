# Ejercicio 1: el flow que corre ingesta_inestable.py.
# Este flow ya corre. Subelo y ejecutalo antes de tocar nada:
#     bash ../subir_a_kestra.sh flow_ingesta.yml ingesta_inestable.py

id: ingesta_diaria
namespace: proyecto.ingesta

tasks:
  - id: ejecutar_ingesta
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: python:3.11-slim
    namespaceFiles:
      enabled: true
    # TODO 1: la fuente falla la mitad de las veces. Agrega un retry de
    # hasta 3 intentos, con 10 segundos entre cada uno.
    retry:
      type: constant
      maxAttempts: 3
      interval: PT10S
    # TODO 2: registrar la fecha de la ejecucion, programada o manual.
    commands:
      - echo "Procesando datos para {{ trigger.date ?? execution.startDate }}"
      - python ingesta_inestable.py

# TODO 3: que corra solo todos los dias a las 6 de la manana.
triggers:
  - id: diario_0600
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    timezone: America/Guayaquil
