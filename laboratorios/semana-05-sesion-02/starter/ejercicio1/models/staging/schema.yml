version: 2

models:
  - name: stg_clientes
    description: Clientes preparados para el modelo intermedio.
    columns:
      - name: id_cliente
        tests:
          - unique
          - not_null
  - name: stg_pedidos
    description: Pedidos con columnas explicitas del archivo de origen.
    columns:
      - name: id_pedido
        tests:
          - unique
          - not_null
      - name: id_cliente
        tests:
          - not_null
          - relationships:
              to: ref('stg_clientes')
              field: id_cliente
